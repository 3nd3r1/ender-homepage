server {
  listen 80;

  root /usr/share/nginx/html;

  # support for client side routing
  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  # next exports generated og images without a file extension
  location ~ /(opengraph|twitter)-image$ {
    default_type image/png;
  }

  error_page 404 /404.html;
  location = /404.html {
      internal;
  }
}
