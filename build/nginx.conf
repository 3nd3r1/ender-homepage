server {
  listen 80;
  server_name card.viljamiranta.fi;

  return 302 https://viljamiranta.fi/card;
}

server {
  listen 80 default_server;

  root /usr/share/nginx/html;

  # support for client side routing
  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  # serve vCard files with proper MIME type for native mobile contact import
  location ~* \.vcf$ {
    default_type text/vcard;
    charset utf-8;
  }

  # next exports generated og images without a file extension
  location ~ /(opengraph|twitter)-image$ {
    default_type image/png;
  }

  error_page 404 /404.html;
  location = /404.html {
      internal;
  }
}
